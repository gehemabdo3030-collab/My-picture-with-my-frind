
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background: white;
    font-family: Arial, sans-serif;
}

/* شاشة كلمة المرور */
#login {
    position: fixed;
    inset: 0;
    background: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 15px;
}

#password {
    padding: 14px;
    width: 220px;
    border: 1px solid #ccc;
    border-radius: 8px;
    text-align: center;
    font-size: 18px;
}

#enter {
    padding: 12px 35px;
    background: black;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
}

#error {
    color: red;
    font-size: 14px;
}

/* زر الصورة */
#btn {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 70px;
    height: 70px;
    border: none;
    border-radius: 50%;
    background: black;
    color: white;
    font-size: 28px;
}

/* الصورة */
#photo {
    display: none;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}
</style>
</head>

<body>

<div id="login">
    <input
        id="password"
        type="password"
        placeholder="Enter Password"
    >

    <button id="enter">Enter</button>

    <div id="error"></div>
</div>

<button id="btn">🖼️</button>

<img id="photo" src="image.jpg">

<script>
const login = document.getElementById("login");
const password = document.getElementById("password");
const enter = document.getElementById("enter");
const error = document.getElementById("error");
const btn = document.getElementById("btn");
const photo = document.getElementById("photo");

enter.onclick = () => {

    if (password.value.trim().toUpperCase() === "MHH") {

        login.style.display = "none";
        btn.style.display = "block";

    } else {

        error.textContent = "Wrong Password";
        password.value = "";

    }
};

password.addEventListener("keydown", (e) => {
    if (e.key === "Enter") enter.click();
});

btn.onclick = () => {
    photo.style.display = "block";
    btn.style.display = "none";
};

let clicks = 0;
let timer;

photo.onclick = () => {

    clicks++;
    clearTimeout(timer);

    if (clicks === 3) {

        photo.style.display = "none";
        btn.style.display = "block";
        clicks = 0;

    } else {

        timer = setTimeout(() => {
            clicks = 0;
        }, 1000);

    }
};
</script>

</body>
</html>
